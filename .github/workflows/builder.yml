name: Qualify builder
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the qualified builder to GHCR (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: manylinux-x86_64
            runner: ubuntu-24.04
          - builder: manylinux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve locked base
        id: lock
        env:
          BUILDER: ${{ matrix.builder }}
        run: python3 -c 'import os, tomllib; print("base=" + tomllib.load(open("builder/lock.toml", "rb"))["builders"][os.environ["BUILDER"]]["base"])' >> "$GITHUB_OUTPUT"
      - run: docker build --build-arg "BASE=${{ steps.lock.outputs.base }}" --build-arg "BUILDER_ID=${{ matrix.builder }}" -t "muxtools-builder:${{ matrix.builder }}" -f builder/Dockerfile .
      - run: docker run --rm -v "$PWD:/work" -e UV_PROJECT_ENVIRONMENT=/tmp/qualify-venv "muxtools-builder:${{ matrix.builder }}" uv run --frozen builder/qualify.py
      - run: docker save "muxtools-builder:${{ matrix.builder }}" | zstd -T0 -o builder.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: qualified-builder-${{ matrix.builder }}
          path: builder.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compiler-tests-${{ matrix.builder }}
          path: dist/qualification
  windows:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: manylinux-x86_64
            runner: windows-2022
          - builder: manylinux-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: compiler-tests-${{ matrix.builder }}
          path: qualification
      - shell: pwsh
        run: |
          Get-ChildItem qualification -Recurse -Filter *.exe | ForEach-Object {
            & $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Qualification failed: $_" }
          }
  publish:
    needs: [qualify, windows]
    if: github.ref == 'refs/heads/main' && inputs.publish
    strategy:
      matrix:
        include:
          - builder: manylinux-x86_64
            runner: ubuntu-24.04
          - builder: manylinux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: qualified-builder-${{ matrix.builder }}
      - run: zstd -dc builder.tar.zst | docker load
      - env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$USER" --password-stdin
          image="ghcr.io/${OWNER,,}/muxtools-builder:${GITHUB_SHA}-${GITHUB_RUN_ID}-${{ matrix.builder }}"
          docker tag "muxtools-builder:${{ matrix.builder }}" "$image"
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
