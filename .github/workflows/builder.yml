name: Qualify builder
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the qualified builder to GHCR (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t muxtools-builder:qualified -f builder/Dockerfile .
      - run: docker run --rm -v "$PWD:/work" -e UV_PROJECT_ENVIRONMENT=/tmp/qualify-venv muxtools-builder:qualified uv run --frozen --no-default-groups --group build builder/qualify.py
      - run: docker save muxtools-builder:qualified | zstd -T0 -o builder.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: qualified-builder
          path: builder.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compiler-tests
          path: dist/qualification
  native:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: compiler-tests
          path: qualification
      - run: uv run --frozen --no-default-groups python builder/qualify-native.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: qualification-${{ matrix.runner }}
          path: qualification-*.json
          if-no-files-found: error
  publish:
    needs: [qualify, native]
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: qualified-builder
      - run: zstd -dc builder.tar.zst | docker load
      - env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$USER" --password-stdin
          image="ghcr.io/${OWNER,,}/muxtools-builder:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker tag muxtools-builder:qualified "$image"
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
