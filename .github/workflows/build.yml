name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names (empty means all)
        type: string
        default: ''
      publish:
        description: Publish verified releases (main only)
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_packages: ${{ steps.matrix.outputs.has_packages }}
      has_releases: ${{ steps.matrix.outputs.has_releases }}
      validation_fingerprint: ${{ steps.matrix.outputs.validation_fingerprint }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Select builds and check prior validation
        id: matrix
        env:
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
          PACKAGES: ${{ inputs.packages }}
          PUBLISH: ${{ inputs.publish }}
        run: uv run --frozen python -m muxtools_binaries.workflow
      - name: Check repository
        if: steps.matrix.outputs.run_checks == 'true'
        run: |
          git submodule update --init
          uv run --frozen just check

  build:
    needs: prepare
    if: needs.prepare.outputs.has_packages == 'true'
    runs-on: ${{ matrix.build_runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Restore source archives
        uses: actions/cache@v5
        with:
          path: build/downloads
          key: source-archives-${{ matrix.package }}-${{ matrix.target }}-${{ hashFiles('packages/**/package.toml') }}
          restore-keys: source-archives-${{ matrix.package }}-${{ matrix.target }}-
      - name: Resolve builder
        if: matrix.builder_kind == 'container'
        id: builder
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
        run: |
          config=$(uv run --frozen muxtools-build builder --target "$TARGET")
          image=$(jq -r .image <<<"$config")
          base=$(jq -r .base <<<"$config")
          if [ -z "$image" ]; then
            image="muxtools-builder:${BUILDER}"
            docker build --build-arg "BASE=$base" --build-arg "BUILDER_ID=$BUILDER" -t "$image" -f builder/Dockerfile .
          elif ! docker manifest inspect "$image" > /dev/null; then
            echo '::error::The configured builder image does not exist or is inaccessible.'
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Install native build tools
        if: matrix.builder_kind == 'native'
        run: brew install autoconf automake libtool pkg-config cmake ninja docbook-xsl libxslt
      - name: Install Rust tools
        if: matrix.builder_kind == 'native' && (startsWith(matrix.package, 'svtav1-') || matrix.package == 'dovi-tool' || matrix.package == 'hdr10plus-tool')
        env:
          RUST_VERSION: "1.95.0"
          RUSTUP_VERSION: "1.28.2"
          RUSTUP_SHA256: "20ef5516c31b1ac2290084199ba77dbbcaa1406c45c1d978ca68558ef5964ef5"
        run: |
          rustup_init="$RUNNER_TEMP/rustup-init"
          curl -fL --retry 5 -o "$rustup_init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/aarch64-apple-darwin/rustup-init"
          echo "${RUSTUP_SHA256}  ${rustup_init}" | shasum -a 256 -c -
          chmod 0755 "$rustup_init"
          "$rustup_init" -y --default-toolchain none --profile minimal
          "$HOME/.cargo/bin/rustup" toolchain install "$RUST_VERSION" --profile minimal
          "$HOME/.cargo/bin/rustup" default "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rm -f "$rustup_init"
      - name: Install cargo-c
        if: matrix.builder_kind == 'native' && startsWith(matrix.package, 'svtav1-')
        run: brew install cargo-c
      - name: Build package in container
        if: matrix.builder_kind == 'container'
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ steps.builder.outputs.image }}
          CHANNEL: ${{ matrix.channel }}
        run: uv run --frozen muxtools-build build "$PACKAGE" --target "$TARGET" --image "$IMAGE" --channel "$CHANNEL"
      - name: Build package natively
        if: matrix.builder_kind == 'native'
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          CHANNEL: ${{ matrix.channel }}
        run: uv run --frozen muxtools-build build "$PACKAGE" --target "$TARGET" --channel "$CHANNEL"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.channel == 'release' && 'release-' || '' }}package-${{ matrix.package }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

  smoke:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_packages == 'true'
    runs-on: ${{ matrix.smoke_runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build Zimtohrli from source
        if: matrix.target == 'linux-arm64'
        run: uv sync --frozen --no-binary-package zimtohrli
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.channel == 'release' && 'release-' || '' }}package-${{ matrix.package }}-${{ matrix.target }}
          path: dist
      - name: Native smoke tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libfuse2t64
          fi
          for archive in dist/*.tar.zst; do
            uv run --frozen muxtools-build test "$archive" --report "$archive.report.json"
          done
      - name: Linux ABI baseline smoke tests
        if: runner.os == 'Linux'
        run: uv run --frozen python builder/baseline-test.py dist/*.tar.zst
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.channel == 'release' && 'release-' || '' }}report-${{ matrix.package }}-${{ matrix.target }}
          path: dist/*.report.json
          if-no-files-found: error
          overwrite: true

  record-validation:
    needs: [prepare, build, smoke]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.validation_fingerprint != '' &&
      ((needs.prepare.outputs.has_packages == 'false' && needs.build.result == 'skipped' && needs.smoke.result == 'skipped') ||
       (needs.build.result == 'success' && needs.smoke.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Write validation marker
        env:
          FINGERPRINT: ${{ needs.prepare.outputs.validation_fingerprint }}
        run: printf '%s\n' "$FINGERPRINT" > validation.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-validation-v1-${{ github.run_attempt }}-${{ needs.prepare.outputs.validation_fingerprint }}
          path: validation.txt
          if-no-files-found: error

  publish:
    needs: [prepare, build, smoke]
    if: success() && needs.prepare.outputs.has_releases == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: binary-publishing
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: release-*
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: uv run --frozen muxtools-build publish --artifacts artifacts --repository "$REPOSITORY" --publish
