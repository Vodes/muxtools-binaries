schema_version = 1
name = "x265"
# Upstream description: https://www.x265.org/
description = "HEVC/H.265 Encoder"
version = "4.3"
version_code = 4
type = "source-build"

[build]
bit_depths = [8, 10, 12]

[build.cmake]
CMAKE_BUILD_TYPE = "Release"
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
ENABLE_SHARED = false
ENABLE_ASSEMBLY = true
ENABLE_LIBNUMA = false

[source]
repository = "https://github.com/Multicorewareinc/x265.git"
tag = "4.3"
commit = "e9b88125dc21393b3fd8d68e98083bdfb89778a8"

# Upstream already uses -O3 in the release profile so we're not specifying any flags here
[targets.linux-x86_64]
toolchain = "clang"
lto = "thin"
cpu_levels = ["baseline", "avx2", "avx512", "zn4"]
extra_ldflags = ["-shared-libgcc", "-Wl,--strip-debug"]

[targets.linux-x86_64.runtime]
requirements = ["libgcc_s.so.1"]

[targets.linux-arm64]
toolchain = "clang"
lto = "thin"
extra_ldflags = ["-shared-libgcc", "-Wl,--strip-debug"]

[targets.linux-arm64.runtime]
requirements = ["libgcc_s.so.1"]

[targets.windows-x86_64]
toolchain = "clang"
lto = "thin"
cpu_levels = ["baseline", "avx2", "avx512", "zn4"]
extra_ldflags = ["-Wl,--strip-debug"]

[targets.windows-arm64]
toolchain = "clang"
lto = "thin"
extra_ldflags = ["-Wl,--strip-debug"]

[targets.macos-arm64]
toolchain = "clang"
lto = "thin"
extra_ldflags = ["-Wl,-S"]

[executables]
x265 = ["--version"]
