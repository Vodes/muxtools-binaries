schema_version = 1
name = "x265"
# Upstream description: https://www.x265.org/
description = "HEVC/H.265 Encoder"
version = "4.2.post1"
version_code = 2
type = "source-build"

[build]
bit_depths = [8, 10, 12]

[build.cmake]
CMAKE_BUILD_TYPE = "Release"
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
ENABLE_SHARED = false
ENABLE_ASSEMBLY = true
ENABLE_LIBNUMA = false

[source]
repository = "https://bitbucket.org/multicoreware/x265_git.git"
tag = "4.2"
commit = "e444744c03978c1fb4e037168967020cf2648427"

# Upstream already uses -O3 in the release profile so we're not specifying any flags here
[targets.linux-x86_64]
compiler = "clang"
lto = "thin"
cpu_levels = ["baseline", "avx2", "avx512", "zn4"]
extra_ldflags = ["-shared-libgcc", "-Wl,--strip-debug"]

[targets.linux-x86_64.runtime]
requirements = ["libgcc_s.so.1"]

[targets.windows-x86_64]
compiler = "clang"
lto = "thin"
cpu_levels = ["baseline", "avx2", "avx512", "zn4"]
extra_ldflags = ["-Wl,--strip-debug"]

[executables]
x265 = ["--version"]
