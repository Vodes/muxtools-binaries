schema_version = 1
name = "mkvtoolnix"
# Upstream description: https://mkvtoolnix.download/
description = "Matroska tools for Linux/Unix and Windows"
version = "102.0"
version_code = 3
type = "source-build"

[source]
repository = "https://codeberg.org/mbunkus/mkvtoolnix.git"
tag = "release-102.0"
commit = "e85150f7e615f9f735f2187d48e808dc56adfe01"
recursive = true

[dependencies.zlib]
repository = "https://github.com/madler/zlib.git"
tag = "v1.3.2"
commit = "da607da739fa6047df13e66a2af6b8bec7c2a498"

[dependencies.zstd]
repository = "https://github.com/facebook/zstd.git"
tag = "v1.5.7"
commit = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[dependencies.ogg]
repository = "https://github.com/xiph/ogg.git"
tag = "v1.3.6"
commit = "be05b13e98b048f0b5a0f5fa8ce514d56db5f822"

[dependencies.vorbis]
repository = "https://github.com/xiph/vorbis.git"
tag = "v1.3.7"
commit = "0657aee69dec8508a0011f47f3b69d7538e9d262"

[dependencies.flac]
repository = "https://github.com/xiph/flac.git"
tag = "1.5.0"
commit = "1507800de4b70e21be71f38caa0d9079d0bc6e45"

[dependencies.boost]
repository = "https://github.com/boostorg/boost.git"
tag = "boost-1.88.0"
commit = "199ef13d6034c85232431130142159af3adfce22"
recursive = true

[dependencies.qtbase]
repository = "https://github.com/qt/qtbase.git"
tag = "v6.8.3"
commit = "c07c2d5a527a644d36e7853d55132ae38921682f"

[dependencies.gmp]
url = "https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
format = "tar.xz"

[dependencies.iconv]
url = "https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.18.tar.gz"
sha256 = "3b08f5f4f9b4eb82f151a7040bfd6fe6c6fb922efe4b1659c66ea933276965e8"
format = "tar.gz"

[targets.linux-x86_64]
toolchain = "gcc"
lto = false
cpu_levels = ["baseline"]
extra_ldflags = ["-shared-libgcc"]

[targets.linux-x86_64.runtime]
requirements = ["libgcc_s.so.1"]

[targets.windows-x86_64]
toolchain = "gcc"
lto = false
cpu_levels = ["baseline"]
extra_cflags = ["-DFLAC__NO_DLL"]
extra_cxxflags = ["-DFLAC__NO_DLL"]

[executables]
mkvmerge = ["--version"]
mkvextract = ["--version"]
mkvinfo = ["--version"]
mkvpropedit = ["--version"]
