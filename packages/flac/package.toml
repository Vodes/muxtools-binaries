schema_version = 1
name = "flac"
# Upstream description: https://github.com/xiph/flac
description = "Free Lossless Audio Codec"
version = "1.5.0.post1"
version_code = 2
type = "source-build"

[build]
configure = ["--disable-doxygen-docs", "--disable-cpplibs"]

[source]
repository = "https://github.com/xiph/flac.git"
tag = "1.5.0"
commit = "1507800de4b70e21be71f38caa0d9079d0bc6e45"

[dependencies.ogg]
repository = "https://github.com/xiph/ogg.git"
tag = "v1.3.6"
commit = "be05b13e98b048f0b5a0f5fa8ce514d56db5f822"

[targets.linux-x86_64]
compiler = "gcc"
lto = false
cpu_levels = ["baseline"]

[targets.windows-x86_64]
compiler = "gcc"
lto = false
cpu_levels = ["baseline"]

[executables]
flac = ["--version"]
metaflac = ["--version"]
