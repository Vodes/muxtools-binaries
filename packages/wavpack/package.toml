schema_version = 1
name = "wavpack"
# Upstream description: https://www.wavpack.com/
description = "Hybrid Lossless Audio Compression"
version = "5.9.0.post1"
version_code = 2
type = "source-build"

[source]
repository = "https://github.com/dbry/WavPack.git"
tag = "5.9.0"
commit = "5803634a030e2a11dba602ba057b89cc34486c67"

[targets.linux-x86_64]
toolchain = "gcc"

[targets.linux-arm64]
toolchain = "gcc"

[targets.windows-x86_64]
toolchain = "gcc"

[targets.windows-arm64]
toolchain = "clang-msvc"  # More of a practical example here, xwin based msvc-abi target
extra_ldflags = ["-luser32", "-lshell32"]

[targets.macos-arm64]
toolchain = "clang"

[executables]
wavpack = ["--version"]
wvunpack = ["--version"]
wvgain = ["-v"]
wvtag = ["--version"]
