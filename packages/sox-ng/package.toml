schema_version = 1
name = "sox-ng"
# Upstream description: https://codeberg.org/sox_ng/sox_ng
description = "SoX_ng audio conversion and inspection tools, packaged as sox and soxi."
version = "14.8.1"
version_code = 1
type = "source-build"

[build]
fftw_url = "https://fftw.org/pub/fftw/fftw-3.3.11.tar.gz"
fftw_sha256 = "5630c24cdeb33b131612f7eb4b1a9934234754f9f388ff8617458d0be6f239a1"
lame_url = "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
lame_sha256 = "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e"

[source]
repository = "https://codeberg.org/sox_ng/sox_ng.git"
tag = "sox_ng-14.8.1"
commit = "a4a14b4f58ac2c08c4cc416a7cffe8a4c50a0b7d"

[dependencies.zlib]
repository = "https://github.com/madler/zlib.git"
tag = "v1.3.2"
commit = "da607da739fa6047df13e66a2af6b8bec7c2a498"

[dependencies.ogg]
repository = "https://github.com/xiph/ogg.git"
tag = "v1.3.6"
commit = "be05b13e98b048f0b5a0f5fa8ce514d56db5f822"

[dependencies.opus]
repository = "https://github.com/xiph/opus.git"
tag = "v1.6.1"
commit = "22244de5a79bd1d6d623c32e72bf1954b56235be"

[dependencies.opusfile]
repository = "https://github.com/xiph/opusfile.git"
tag = "v0.12"
commit = "a55c164e9891a9326188b7d4d216ec9a88373739"

[dependencies.flac]
repository = "https://github.com/xiph/flac.git"
tag = "1.5.0"
commit = "1507800de4b70e21be71f38caa0d9079d0bc6e45"

[dependencies.vorbis]
repository = "https://github.com/xiph/vorbis.git"
tag = "v1.3.7"
commit = "0657aee69dec8508a0011f47f3b69d7538e9d262"

[dependencies.png]
repository = "https://github.com/pnggroup/libpng.git"
tag = "v1.6.58"
commit = "3061454d980de7d53608f594194cfac722721d2a"

[dependencies.id3tag]
repository = "https://codeberg.org/tenacityteam/libid3tag.git"
tag = "0.16.4"
commit = "fff52d4e27a6f8e3a714bd304e4258d9e1b0dad8"

[dependencies.sndfile]
repository = "https://github.com/libsndfile/libsndfile.git"
tag = "1.2.2"
commit = "72f6af15e8f85157bd622ed45b979025828b7001"

[dependencies.wavpack]
repository = "https://github.com/dbry/WavPack.git"
tag = "5.9.0"
commit = "5803634a030e2a11dba602ba057b89cc34486c67"

[targets.linux-x86_64]
compiler = "gcc"
lto = false
cpu_levels = ["baseline"]

[targets.windows-x86_64]
compiler = "gcc"
lto = false
cpu_levels = ["baseline"]
extra_cflags = ["-DFLAC__NO_DLL"]

[executables]
sox = ["--version"]
soxi = []
