[project]
name = "muxtools-binaries"
version = "0.2.0"
description = "Pinned portable binary builds and explicit releases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0,<19",
    "httpx2>=2.13.0,<3",
    "numpy>=2.5.3,<3",
    "packaging>=26.3",
    "py-cpuinfo2>=10.1.1,<11",
    "py7zr>=1.1.3,<2",
    "pydantic>=2.13.5,<3",
    "tombi>=0.11.7,<1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "tomlkit>=0.15.1,<1",
    "zimtohrli>=0.2.1.post1,<0.3",
    "zstandard>=0.25.0,<1",
]

[project.scripts]
muxtools-build = "muxtools_binaries.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.8",
    "rust-just>=1.58.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
]
docs = [
    "zensical>=0.0.63,<0.1",
]

[build-system]
requires = ["uv_build>=0.8.24,<0.9"]
build-backend = "uv_build"

[tool.pyrefly]
preset = "default"
project-includes = ["src/**/*.py", "tests/**/*.py", "builder/**/*.py", "packages/**/*.py"]
search-path = ["src", "stubs"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "packages"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
extend-exclude = ["context"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.tombi.files]
include = ["**/*.toml"]
exclude = ["context/**", "build/**", "dist/**", ".venv/**"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 120
